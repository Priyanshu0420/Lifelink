spring.config.import=optional:file:.env[.properties]

spring.application.name=Lifelink

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secretKey=${JWT_SECRET}

lifelink.public-url=${FRONTEND_URL}
lifelink.frontend-url=${FRONTEND_URL:http://localhost:5173}
server.address=0.0.0.0
server.port=${PORT:8080}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

brevo.from=${BREVO_FROM}
brevo.from.name=${BREVO_FROM_NAME}